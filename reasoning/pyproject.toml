[project]
name = "reasoning"
version = "0.1.0"
description = "Building reasoning capabilities on top of a base LLM"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "tokenizers>=0.22.2",
    "torch>=2.10.0",
    "tqdm>=4.60.0",
    "sympy>=1.12",
    "huggingface-hub>=1.7.2",
    "safetensors>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
